<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samah Mohammed | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6432a8;
            --primary-light: #8e5bd3;
            --bg: #fcfaff;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #332d41;
            --secondary-bg: #f3efff;
            --border: #eeeeee;
            --shadow: rgba(100, 50, 168, 0.1);
        }

        [data-theme="dark"] {
            --bg: #0d0b14;
            --header-bg: #161421;
            --card-bg: #1a1726;
            --text: #e0dced;
            --secondary-bg: #241f3a;
            --border: #2d2845;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.4s, color 0.4s;
            line-height: 1.6;
        }

        /* Header */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .logo-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px var(--shadow);
            border: 2px solid var(--primary);
        }

        .hello-text {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 400;
            display: block;
        }

        .name-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .social-links a {
            font-size: 18px;
            color: var(--primary);
            background: var(--secondary-bg);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-links a:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* Sections */
        .container {
            max-width: 850px;
            margin: auto;
            padding: 40px 20px;
        }

        section {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 5px 15px var(--shadow);
        }

        h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        .cv-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--primary);
            color: #ffffff !important;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }

        .cv-btn:hover {
            transform: scale(1.05);
            background: var(--primary-light);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        .skill-item {
            background: var(--secondary-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .skill-item i {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }

        /* Projects */
        .project-card {
            background: var(--secondary-bg);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            border-right: 5px solid var(--primary);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:last-child {
            margin-bottom: 0;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .project-image {
            width: 100%;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .project-image img {
            width: 100%;
            height: auto;
            max-height: 360px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        .project-content h3 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 10px;
            direction: ltr;
            text-align: right;
        }

        .project-content p {
            color: var(--text);
            font-size: 0.98rem;
            margin-bottom: 16px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tag {
            background-color: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--primary-light);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .project-links .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary);
            color: #ffffff !important;
            text-decoration: none;
            padding: 9px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        .project-links .btn:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .contact-me {
            background: var(--primary) !important;
            color: #ffffff;
            text-align: center;
        }

        .contact-me h2 {
            color: #ffffff;
            justify-content: center;
        }

        .contact-me h2::after {
            display: none;
        }

        .contact-me .social-links a {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .contact-me .social-links a:hover {
            background: #ffffff;
            color: var(--primary);
        }

            position: absolute;
